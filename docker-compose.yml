version: '3.8'

services:
  backend:
    build: .
    container_name: offerflow-backend
    ports:
      - "8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DATABASE_URL=sqlite:///./offerflow.db
    volumes:
      - ./offerflow.db:/app/offerflow.db
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  # 前端（可选，生产环境使用）
