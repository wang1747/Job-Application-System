# ============================================================
#  OfferFlow 生产 nginx 配置
#  功能：80 跳 443 / HTTPS / 安全头 / gzip / 静态缓存 / API 反代
#  证书：放 deploy/certs/ 下，文件名 cert.pem / key.pem
#        可用 Let's Encrypt 或自签测试
# ============================================================

# ---------- HTTP -> HTTPS 跳转 ----------
server {
    listen 80;
    server_name _;
    # ACME challenge 预留（如用 certbot standalone 可走 80）
    location /.well-known/acme-challenge/ {
        root /etc/nginx/certs;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- SSL 证书 ---
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 5m;

    # --- 安全响应头 ---
    add_header X-Frame-Options       "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header X-XSS-Protection      "1; mode=block"        always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- 上传体积（简历 / JD OCR 截图）---
    client_max_body_size 20m;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;

    # --- 前端静态文件 ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存（Vite 带 hash）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # index.html 不缓存，保证发布即时生效
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --- API 反向代理 ---
    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型响应可能较慢
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;  # SSE / 流式响应
    }

    # --- 健康检查（不记日志）---
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
